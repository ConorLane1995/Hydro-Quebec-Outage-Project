services:
  collector:
    build: .
    image: hq-collector
    restart: unless-stopped
    volumes:
      - ./records:/app/records
      - ./logs:/app/logs

  roadwork:
    build: .
    command: python roadwork_collector.py
    restart: unless-stopped
    volumes:
      - ./records:/app/records
      - ./logs:/app/logs

  db:
    image: postgis/postgis:17-3.5
    profiles: ["db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  pgdata: